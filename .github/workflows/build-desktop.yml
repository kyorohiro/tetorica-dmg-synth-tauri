name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python scripts/import_release.py --check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --out artifacts/desktop-browser.json --screenshots artifacts/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmg-desktop-browser
          path: artifacts/
          if-no-files-found: ignore

  build:
    permissions:
      contents: write # tauri-action attaches assets to the draft release on tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            bundles: dmg
          - platform: macos-x86_64
            runner: macos-15-intel
            bundles: dmg
          - platform: windows-x86_64
            runner: windows-latest
            bundles: nsis
          - platform: linux-x86_64
            runner: ubuntu-24.04
            bundles: deb,appimage
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf xdg-utils
      - run: npm ci
      - run: npm test
      - name: Test native PCM output
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify committed Synth assets
        run: python scripts/import_release.py --check
      - name: Build desktop app
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles ${{ matrix.bundles }} -- --locked
      - name: Build and attach to draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.bundles }} -- --locked
          tagName: ${{ github.ref_name }}
          releaseName: Tetorica DMG Synth ${{ github.ref_name }}
          releaseBody: Desktop builds of Tetorica DMG Synth. Unsigned builds; review before publishing.
          releaseDraft: true
          prerelease: false
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tetorica-dmg-synth-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
